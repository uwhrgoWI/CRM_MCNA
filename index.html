<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise CRM Pro - Aura Systems</title>
    
    <!-- Google Fonts: Outfit (display) & Plus Jakarta Sans (body) & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome 6 Icons from cdnjs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Vanilla CRM Stylesheet -->
    <link rel="stylesheet" href="/src/crm.css">
  </head>
  <body class="selection:bg-blue-500 selection:text-white">
    <!-- Main Toast Notification Container -->
    <div id="toast-wrapper" class="toast-wrap"></div>

    <!-- Active App Shell / Screens Router -->
    <div id="app-root" class="app-root-container">
      <!-- App screens will dynamically inject here -->
      <div id="screen-loading" class="screen-loader">
        <div class="loader-spinner"></div>
        <p>Đang tải hệ thống CRM Pro...</p>
      </div>
    </div>

    <!-- Switch Role Demo Hover Panel (Bottom-Right Floating trigger) -->
    <div id="demo-role-switcher" class="demo-floating-switcher" style="display:none;">
      <button class="switcher-trigger-btn" aria-label="Đổi nhanh vai trò demo">
        <i class="fa-solid fa-masks-theater text-indigo-400"></i> Code Demo
      </button>
      <div class="switcher-options">
        <p class="switcher-title">Mô phỏng Đăng nhập nhanh:</p>
        <div class="switcher-grid">
          <button class="sw-btn btn-sa" data-role="superadmin">Super Admin</button>
          <button class="sw-btn btn-sm" data-role="manager">Manager</button>
          <button class="sw-btn btn-sr" data-role="sales">Sales Rep</button>
          <button class="sw-btn btn-su" data-role="support">Support</button>
        </div>
      </div>
    </div>

    <!-- Main JS Application Router -->
    <script type="module" src="/src/crm.js"></script>
  </body>
</html>
